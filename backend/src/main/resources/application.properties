spring.application.name=SkillSwap API
server.port=8080
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/skillswap;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.error.include-message=always
app.cors-origin=${CORS_ORIGIN:http://localhost:3000}
app.jwt-secret=${JWT_SECRET:DEVELOPMENT_ONLY_REPLACE_WITH_A_64_CHARACTER_RANDOM_SECRET_BEFORE_DEPLOYING}
app.demo=${DEMO_MODE:true}
app.storage-dir=${STORAGE_DIR:./uploads}
app.commission-bps=${COMMISSION_BPS:500}
app.gst-bps=${GST_BPS:1800}
app.razorpay-key-id=${RAZORPAY_KEY_ID:}
app.razorpay-key-secret=${RAZORPAY_KEY_SECRET:}
